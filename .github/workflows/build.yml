
name: Build CoreOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build CoreOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            gcc \
            gcc-multilib \
            libc6-dev-i386 \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools

      - name: Check tools
        run: |
          echo "GCC:"
          gcc --version

          echo "GRUB:"
          grub-mkrescue --version

          echo "mformat:"
          which mformat
          mformat -V

          echo "xorriso:"
          xorriso --version

      - name: Build bootloader
        run: |
          gcc -m32 \
            -c boot.s \
            -o boot.o

      - name: Build kernel
        run: |
          gcc -m32 \
            -std=gnu99 \
            -ffreestanding \
            -O2 \
            -Wall \
            -Wextra \
            -c kernel.c \
            -o kernel.o

      - name: Link kernel
        run: |
          gcc -m32 \
            -T linker.ld \
            -ffreestanding \
            -O2 \
            -nostdlib \
            -o kernel.bin \
            boot.o \
            kernel.o \
            -lgcc

      - name: Verify kernel
        run: |
          file kernel.bin
          grub-file --is-x86-multiboot kernel.bin
          echo "Multiboot kernel verified successfully."

      - name: Prepare ISO files
        run: |
          rm -rf iso
          mkdir -p iso/boot/grub

          cp kernel.bin iso/boot/kernel.bin
          cp grub.cfg iso/boot/grub/grub.cfg

          echo "ISO contents:"
          find iso -type f -print

      - name: Build ISO
        env:
          TMPDIR: /tmp
        run: |
          grub-mkrescue \
            -o "$GITHUB_WORKSPACE/coreos.iso" \
            "$GITHUB_WORKSPACE/iso"

      - name: Verify ISO
        run: |
          ls -lh coreos.iso
          file coreos.iso

      - name: Upload CoreOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: CoreOS-ISO
          path: coreos.iso
          if-no-files-found: error

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: CoreOS-Kernel
          path: kernel.bin
          if-no-files-found: error
```
