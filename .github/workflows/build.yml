
name: Build CoreOS Kernel

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CoreOS
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            gcc-multilib \
            libc6-dev-i386 \
            binutils \
            grub-common

      - name: Build bootloader
        run: |
          gcc -m32 \
            -c boot.s \
            -o boot.o

      - name: Build kernel
        run: |
          gcc -m32 \
            -std=gnu99 \
            -ffreestanding \
            -O2 \
            -Wall \
            -Wextra \
            -c kernel.c \
            -o kernel.o

      - name: Link kernel
        run: |
          gcc -m32 \
            -T linker.ld \
            -ffreestanding \
            -O2 \
            -nostdlib \
            -o kernel.bin \
            boot.o \
            kernel.o \
            -lgcc

      - name: Verify kernel
        run: |
          file kernel.bin
          grub-file --is-x86-multiboot kernel.bin
          echo "CoreOS kernel passed Multiboot verification!"

      - name: Upload kernel.bin
        uses: actions/upload-artifact@v4
        with:
          name: CoreOS-Kernel
          path: kernel.bin
          if-no-files-found: error
```

### What this should produce

After the workflow finishes:

**Actions → Build CoreOS Kernel → Build Kernel → Artifacts**

You should see:

`CoreOS-Kernel`

Inside it:

`kernel.bin`

And importantly, **there's no `grub-mkrescue`, `xorriso`, `mtools`, or ISO generation involved yet.**

If this succeeds, we've got a known-good `kernel.bin`. Then we'll add the ISO step as a completely separate stage. 🚀
