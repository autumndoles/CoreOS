name: Build MyOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso

      - name: Build bootloader
        run: |
          gcc -m32 -c boot.s -o boot.o

      - name: Build kernel
        run: |
          gcc -m32 \
            -std=gnu99 \
            -ffreestanding \
            -O2 \
            -Wall \
            -Wextra \
            -c kernel.c \
            -o kernel.o

      - name: Link kernel
        run: |
          gcc -m32 \
            -T linker.ld \
            -ffreestanding \
            -O2 \
            -nostdlib \
            -o kernel.bin \
            boot.o \
            kernel.o \
            -lgcc

      - name: Verify Multiboot header
        run: |
          grub-file --is-x86-multiboot kernel.bin
          echo "Multiboot header detected!"

      - name: Create ISO
        run: |
          mkdir -p iso/boot/grub
          cp kernel.bin iso/boot/kernel.bin
          cp grub.cfg iso/boot/grub/grub.cfg

          grub-mkrescue \
            -o myos.iso \
            iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-ISO
          path: myos.iso

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-Kernel
          path: kernel.bin
